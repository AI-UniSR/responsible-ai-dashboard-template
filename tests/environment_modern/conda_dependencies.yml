name: rai-replay-modern-test
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # Azure / MLflow stack (azureml-mlflow 1.60 needs mlflow < 3; mlflow 2.22 needs pyarrow < 20,
      # which rules out mltable >= 1.7)
      - azureml-mlflow==1.60.0.post1
      - mlflow==2.22.4
      - mltable==1.6.3
      - azure-identity
      # A model stack the RAI environment (Python 3.10, numpy 1.23, pandas 1.5,
      # scikit-learn 1.5) cannot load
      - numpy==2.2.6
      - pandas==2.3.3
      - scipy==1.16.3
      - scikit-learn==1.9.1
      - scikit-survival==0.28.0
      # Testing
      - pytest==8.3.5
