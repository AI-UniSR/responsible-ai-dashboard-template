# Records the configuration of the published Med-CLI run; not submittable as-is (references
# workspace assets that only exist in the original subscription).
$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json

experiment_name: responsible-ai-dashboard
type: pipeline
display_name: "Responsible AI Dashboard (Med-CLI, 90-day mortality)"

inputs:
  model_name: "survival-cox-model"
  model_version: 6
  time_column: tte
  event_column: event
  time_horizon: 90
  binary_label_name: 'label'
  extra_features: '["Barthel Score (Admission)", "Frailty Index (without PMH)", "CCSI"]'
  remove_missing: "all"

  dev_training_data:
    type: uri_folder
    path: azureml:survival-train-data:9
  dev_test_data:
    type: uri_folder
    path: azureml:survival-test-data:9

jobs:
  prepare_model_and_data_for_rai:
    type: command
    component: ../../components/prepare_model_and_data_for_rai/component.yml
    inputs:
      model_name: ${{parent.inputs.model_name}}
      model_version: ${{parent.inputs.model_version}}
      binary_label_name: ${{parent.inputs.binary_label_name}}
      time_column: ${{parent.inputs.time_column}}
      event_column: ${{parent.inputs.event_column}}
      time_horizon: ${{parent.inputs.time_horizon}}
      train_data: ${{parent.inputs.dev_training_data}}
      test_data: ${{parent.inputs.dev_test_data}}
      extra_features: ${{parent.inputs.extra_features}}
      remove_missing: ${{parent.inputs.remove_missing}}
      # Locked cutoff, derived on the derivation cohort — see test_assets/test_assets.json.
      test_assets:
        type: uri_folder
        path: ./test_assets
    outputs:
      train_data_out:
        type: mltable
      test_data_out:
        type: mltable
      model_info_path:

  create_rai_job_dev:
    type: command
    component: azureml://registries/azureml/components/rai_tabular_insight_constructor/versions/0.21.0
    inputs:
      title: "Responsible AI Dashboard (Med-CLI, 90-day mortality)"
      task_type: classification
      model_info_path: ${{parent.jobs.prepare_model_and_data_for_rai.outputs.model_info_path}}
      train_dataset: ${{parent.jobs.prepare_model_and_data_for_rai.outputs.train_data_out}}
      test_dataset: ${{parent.jobs.prepare_model_and_data_for_rai.outputs.test_data_out}}
      target_column_name: ${{parent.inputs.binary_label_name}}
      classes: '[false, true]'
      use_model_dependency: true
    outputs:
      rai_insights_dashboard:

  error_analysis_dev:
    type: command
    component: azureml://registries/azureml/components/rai_tabular_erroranalysis/versions/0.21.0
    inputs:
      rai_insights_dashboard: ${{parent.jobs.create_rai_job_dev.outputs.rai_insights_dashboard}}
      max_depth: 3
      filter_features: '[]'

  gather_01:
    type: command
    component: azureml://registries/azureml/components/rai_tabular_insight_gather/versions/0.21.0
    inputs:
      constructor: ${{parent.jobs.create_rai_job_dev.outputs.rai_insights_dashboard}}
      insight_1: ${{parent.jobs.error_analysis_dev.outputs.error_analysis}}
